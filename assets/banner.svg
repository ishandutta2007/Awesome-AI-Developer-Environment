<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-gradient)" />
  
  <!-- Grid pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="350" fill="url(#grid)" />
  </g>

  <!-- Background Animated / Dynamic Elements (kept in background with low opacity and blur) -->
  <g opacity="0.25">
    <circle cx="150" cy="100" r="80" fill="#6366f1" filter="url(#glow)">
      <animate attributeName="cy" values="100;120;100" dur="6s" repeatCount="indefinite" />
      <animate attributeName="r" values="80;90;80" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="250" r="100" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="cy" values="250;230;250" dur="7s" repeatCount="indefinite" />
      <animate attributeName="r" values="100;110;100" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="80" r="60" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="cx" values="900;920;900" dur="5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <!-- Main Title -->
    <text x="600" y="140" fill="url(#accent-gradient)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="1" filter="url(#glow)">
      Awesome AI Developer Environment
    </text>
    
    <!-- Subtitle -->
    <text x="600" y="195" fill="#e2e8f0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="22" letter-spacing="0.5">
      Curated List of SaaS Platforms &amp; Open-Source Projects for AI-Powered Coding
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 240)">
      <!-- Pill 1 -->
      <g transform="translate(320, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <text x="80" y="23" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="14" text-anchor="middle">⚡ Prompt-to-App</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <text x="80" y="23" fill="#c084fc" font-family="sans-serif" font-weight="600" font-size="14" text-anchor="middle">🤖 AI Agents</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(720, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
        <text x="80" y="23" fill="#4ade80" font-family="sans-serif" font-weight="600" font-size="14" text-anchor="middle">☁️ Cloud IDEs</text>
      </g>
    </g>
  </g>
</svg>
